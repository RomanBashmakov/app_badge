#
# STM32WB55 (WeAct) через J-Link: вариант target/stm32wbx.cfg
# с фиксированной низкой частотой SWD (200 кГц).
#
# Зачем: на этой связке (дюпон-провода + J-Link V13) чтения на
# 1–2 МГц «сыплются» (CPUID читается через раз, ROM-таблица и
# регистры флеша — почти никогда), из-за чего падают reset halt и
# program. Стоковый cfg ещё и разгоняет адаптер до 4 МГц в
# reset-init. На 200 кГц все чтения стабильны (проверено:
# CPUID/DBGMCU_ID/FLASH_ACR/UID).
#
# Использование (в контейнере с zephyr-sdk):
#   openocd -s <sdk-scripts> -f этот_файл.cfg \
#     -c "init" -c "reset halt" \
#     -c "program build/zephyr/zephyr.bin verify 0x08000000" \
#     -c "reset run" -c "shutdown"

source [find interface/jlink.cfg]
transport select swd
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

set _CHIPNAME stm32wbx
set _ENDIAN little

# SWD IDCODE (single drop, arm)
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
	-expected-id 0x6ba02477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 \
	-work-area-size 0x10000 -work-area-backup 0

# WB55: 1 MB flash, драйвер stm32l4x (как в стоковом cfg).
flash bank $_CHIPNAME.flash stm32l4x 0x08000000 0x100000 0 0 $_TARGETNAME

# Фиксированные 200 кГц: проверенная стабильная частота для этой
# разводки. НЕ повышать без проверки чтений CPUID/FLASH_ACR.
adapter speed 200
adapter srst delay 100
reset_config srst_nogate
cortex_m reset_config sysresetreq

# События как в стоковом cfg, но без разгона адаптера.
$_TARGETNAME configure -event reset-init {
	mmw 0x58004000 0x00000102 0  ;# FLASH_ACR |= PRFTBE | latency 2
	mmw 0x58000000 0x00000091 0  ;# RCC_CR = MSI_ON | 24 МГц
}
$_TARGETNAME configure -event reset-start {
	adapter speed 200
}
$_TARGETNAME configure -event examine-end {
	# DBGMCU_CR |= DBG_STANDBY | DBG_STOP | DBG_SLEEP (через catch)
	catch { mmw 0xE0042004 0x00000007 0 }
	# остановить IWDG/WWDG на время halt (через catch)
	catch { mmw 0xE004203C 0x00001800 0 }
}
