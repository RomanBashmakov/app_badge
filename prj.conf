# ================================================================== #
#  Базовая периферия                                                   #
# ================================================================== #
CONFIG_GPIO=y

# ================================================================== #
#  Акселерометр LIS2DH12 (модуль RobotClass, узел &lis2dh12 на i2c1)   #
#                                                                     #
#  CONFIG_SENSOR — подсистема Zephyr: единый API                      #
#                  (sensor_sample_fetch / sensor_channel_get /        #
#                  sensor_attr_set) для любых сенсоров;               #
#  CONFIG_I2C    — шина (драйвер LIS2DH включил бы её сам, но         #
#                  пропишем явно, как в сэмпле samples/sensor/lis2dh);#
#  CONFIG_LIS2DH — драйвер drivers/sensor/st/lis2dh; включается сам   #
#                  по факту узла в devicetree, здесь явно для         #
#                  наглядности.                                       #
#                                                                     #
#  Параметры чипа (см. Kconfig в drivers/sensor/st/lis2dh):           #
#    OPER_MODE_NORMAL    — 10-бит режим (баланс разрешение/ток);      #
#    ACCEL_RANGE_RUNTIME — диапазон ±2/4/8/16g задаём из кода (±2g);  #
#    ODR_RUNTIME         — частоту измерений задаём из кода (10 Гц).  #
#                                                                     #
#  Этап 2 (триггеры по INT1 → PB0): добавить                          #
#    CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y — тогда прерывания чипа    #
#    обрабатывает драйвер в системной workqueue (без своего потока).  #
#                                                                     #
#  Встроенный датчик температуры кристалла: канал SENSOR_CHAN_DIE_TEMP#
#  (источник данных для ESS 0x2A6E — внешнего термометра на плате нет)#
# ================================================================== #
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_LIS2DH=y
CONFIG_LIS2DH_OPER_MODE_NORMAL=y
CONFIG_LIS2DH_ACCEL_RANGE_RUNTIME=y
CONFIG_LIS2DH_ODR_RUNTIME=y
CONFIG_LIS2DH_MEASURE_TEMPERATURE=y

# Печать %f в LOG_* (sensor_value_to_double): поддержка дробных в
# cbprintf (+ несколько КБ flash). Без неё — только целые числа.
CONFIG_CBPRINTF_FP_SUPPORT=y

# Стек main-потока: в нём до main() выполняются POST_KERNEL-инициализации
# устройств (включая драйвер lis2dh с LOG_INF). Дефолтных 1024 байт
# не хватило — MPU FAULT "Stack overflow" при загрузке (поймано по RTT).
CONFIG_MAIN_STACK_SIZE=2048

# Стек idle-потока: на нём работает z_cstart (boot-контекст), где тоже
# выполняются инициализации устройств. Дефолтные на ARM 384 байта
# переполнились прямо в init драйвера lis2dh (LOG-пакет 256 Б +
# кадры драйвера) — MPU FAULT по адресу стека z_idle_stacks.
CONFIG_IDLE_STACK_SIZE=1024

# Стек потока обработки логов: он форматирует %f (cbprintf FP) —
# дефолтного запаса на 6 аргументов-Double может не хватить.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# ================================================================== #
#  LoRa-трансивер SX1272 (штатная подсистема Zephyr, узел в app.overlay)#
#                                                                     #
#  CONFIG_LORA                             — API lora_config/recv;     #
#  CONFIG_LORA_MODULE_BACKEND_LORAMAC_NODE — низкоуровневый драйвер    #
#        SX127x из модуля modules/lib/loramac-node. Чип определяется   #
#        по devicetree: compatible = "semtech,sx1272".                 #
# ================================================================== #
CONFIG_SPI=y
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_LORAMAC_NODE=y
# LoRaWAN не используется: работаем на уровне LoRa-модема (точка-точка).
CONFIG_LORAWAN=n
# Shell-команды lora (config/send/recv) для интерактивной проверки —
# выключены: shell по RTT поллит канал и мешает CPU1 входить в STOP2.
# Для отладки включить вместе с shell (см. блок ниже):
# CONFIG_LORA_SHELL=y

# ================================================================== #
#  Низкое энергопотребление CPU1: PM + Tickless                       #
#                                                                     #
#  ВНИМАНИЕ: PM ВРЕМЕННО ВЫКЛЮЧЕН. С CONFIG_PM=y после загрузки       #
#  I2C-обмен с LIS2DH12 сыпется ошибками (-EIO, «failed to read       #
#  reg_ctrl1», «did not enter suspended state») — конфликт            #
#  suspend/resume I2C1 при входе в STOP2 (нет sleep-pinctrl у i2c1    #
#  в DTS платы). Починить: добавить pinctrl-1 (sleep) для PB8/PB9     #
#  или разобрать pm_device политику драйвера lis2dh. Пока — PM=n,     #
#  всё остальное (tickless) без изменений.                            #
# ================================================================== #
# CONFIG_PM=y
CONFIG_PM=n
CONFIG_PM_DEVICE=n
CONFIG_TICKLESS_KERNEL=y

# === Консоль через SEGGER RTT (вместо USB CDC ACM) ===

# Базовая консоль
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# Отключаем UART-консоль, чтобы не было конфликта с RTT
CONFIG_UART_CONSOLE=n

# Включаем библиотеку SEGGER RTT
CONFIG_USE_SEGGER_RTT=y

# Up-буфер RTT (Ch1, логи): 4 КБ вместо 1 КБ — boot-пачка логов не
# дропается, пока openocd-RTT-сервер медленно подтягивает данные
# (LOG_BACKEND_RTT_MODE_DROP + буфер по умолчанию 1 КБ теряли
# init-сообщения журнала/PSA/littlefs при старте).
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Down-буфер RTT (Ch0, ввод в shell): дефолтные 16 Б приводили к
# склейке команд ("journal dump 40\r\n" — ровно 16 Б, хвост затирался).
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=64

# Направляем консольный вывод в RTT (Channel 0)
CONFIG_RTT_CONSOLE=y

# === Shell поверх RTT (Channel 0) ===
# ВНИМАНИЕ (энергопотребление): поллинг RTT-бекенда не даёт CPU1 войти
# в STOP2 (см. coconut_vibe). Сейчас включён для отладки внешней FLASH
# (journal dump/clear, fs ls) — включение в секции «Shell на RTT» ниже.
# Перед возвратом PM (STOP2) выключить (CONFIG_SHELL=n).
# CONFIG_KERNEL_SHELL=y

# === Подсистема логирования (LOG_INF/LOG_ERR/...) в SEGGER RTT ===
CONFIG_LOG=y
# RTT-бекенд: направляет сообщения LOG_* в SEGGER RTT
CONFIG_LOG_BACKEND_RTT=y
# Логи — на RTT Channel 1: Channel 0 занят консолью (CONFIG_RTT_CONSOLE).
CONFIG_LOG_BACKEND_RTT_BUFFER=1
# Режим DROP (терять при переполнении): не блокирует CPU. Для отладки
# можно поставить BLOCK — надёжнее, но ценой задержек.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
# Максимальный размер одного сообщения лога (байт)
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=256
# Уровень логирования по умолчанию: 3 = INF — на время разработки.
# Перед замером тока поставить 1 (только ERR): логи будят CPU1 из STOP2.
# 1 = ERR, 2 = WRN, 3 = INF, 4 = DBG.
CONFIG_LOG_DEFAULT_LEVEL=3
# Буферизация логов: накапливать в кольцевом буфере, сбрасывать
# порциями — реже будит CPU из STOP2. При переполнении старые теряются.
CONFIG_LOG_MODE_OVERFLOW=y

# ================================================================== #
#  Bluetooth LE (on-chip радио CPU2)                                   #
#                                                                     #
#  Радиомодуль STM32WB55 (CPU2) управляется через IPCC/IPM-драйвер     #
#  (drivers/bluetooth/hci/ipm_stm32wb.c). Узел ble_rf уже включён     #
#  в stm32wb.dtsi, а zephyr,bt-hci = &ble_rf — в chosen.              #
#  Поэтому CONFIG_BT_STM32_IPM включается автоматически.              #
# ================================================================== #

# Базовый стек Bluetooth LE (Host + Controller-драйвер IPM)
CONFIG_BT=y

# Периферийная роль (бейдж — периферия для хоста)
CONFIG_BT_PERIPHERAL=y

# Менеджер безопасности (SMP): задел под шифрованный канал данных
CONFIG_BT_SMP=y

# Хранение ключей спаривания и ID-адреса во flash (NVS).
# Сохраняет bonding между перезагрузками (ключи, IRK, CSRK).
# ВАЖНО: при CONFIG_BT_SETTINGS=y стек НЕ создаёт ID-адрес сам.
# Приложение обязано вызвать settings_load() ПОСЛЕ bt_enable()
# (в callback'е bt_ready в ble.c), иначе реклама падает с -EAGAIN (-11):
#   "No ID address. App must call settings_load()".
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Имя устройства, которое увидит хост (телефон/ПК) при сканировании
CONFIG_BT_DEVICE_NAME="Badge"

# Увеличиваем стек системной очереди работ (settings/BT требуют больше)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ================================================================== #
#  Энергосбережение BLE (connection parameters)                       #
#                                                                     #
#  Минимизируем активность радио CPU2 через большие connection        #
#  interval + slave latency: радио просыпается раз в ~4 секунды.      #
#  Параметры передаются хосту через GAP; хост применяет их            #
#  ПОСЛЕ успешного подключения.                                       #
# ================================================================== #
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
# interval: единица 1.25 мс.
# MIN=320, MAX=320 → 400 мс между connection events.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=320
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=320
# slave latency: пропуск 9 events → радио спит ~4 сек (9*400 мс)
CONFIG_BT_PERIPHERAL_PREF_LATENCY=9
# supervision timeout: единица 10 мс.
# Требование BLE: timeout > (1+latency)*interval*2 → 6 > (1+9)*0.4*2=8 ❌
# Поэтому при latency=9 interval=400мс нужен timeout > 8 сек → 1000 (10с).
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=1000

# ================================================================== #
#  GATT-сервисы данных жетона (контракт: android_badge/PROTOCOL.md)     #
#                                                                       #
#  Стандартные (готовые подсистемы Zephyr):                             #
#    BAS  0x180F — уровень заряда (пока заглушка 100 %: нет             #
#                  мониторинга АКБ на отладочной плате);                #
#    DIS  0x180A — версия ПО (Firmware Revision).                       #
#  ESS 0x181A/0x2A6E (температура) — готового сервиса в Zephyr НЕТ      #
#    (CONFIG_BT_ESS не существует), реализован в src/gatt_badge.c       #
#    c SIG-UUID; источник — термодатчик кристалла LIS2DH12.             #
#  Кастомный сервис BAD6E001 (аксель BAD6E002 + конфиг BAD6E003) —      #
#    тоже src/gatt_badge.c; конфиг хранится в settings/NVS badge/cfg.   #
# ================================================================== #
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="1.0.0"

# ================================================================== #
#  MCUmgr over BLE + MCUboot (OTA: upload → test → reset → confirm)     #
#                                                                       #
#  Раскладка флеша платы weact_stm32wb55_core (партии в её DTS):        #
#    0x08000000 mcuboot (48 КБ) · 0x0800C000 slot0 (400 КБ) ·           #
#    0x08070000 slot1 (400 КБ) · 0x080D4000 scratch (16 КБ) ·           #
#    0x080D8000 storage/NVS (8 КБ).                                     #
#  Сборка MCUboot: см. README (bootloader/mcuboot/boot/zephyr).         #
#  Подпись образа: тот же ключ, что у бутлоадера (RSA-2048,             #
#  root-rsa-2048.pem из модуля MCUboot; путь относителен west topdir).  #
#  Артефакт OTA: build/zephyr/app_update.bin (подписан автоматически).  #
# ================================================================== #
CONFIG_ZCBOR=y			# зависимость MCUMGR (библиотека CBOR)
CONFIG_STREAM_FLASH=y		# зависимость IMG_MANAGER
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# На время SMP-обмена — быстрые conn params (после — медленные из
# CONFIG_BT_PERIPHERAL_PREF_*); ускоряет OTA на порядок.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
# SMP-сервис без требования pairing (фаза 1; дефолт при BT_SMP=y —
# RW_AUTHEN, что ломает just-works сопряжение с приложением).
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_MANAGER=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"

# MTU для SMP/OTA: 247 байт ATT (нужно приложению mcumgr-ble;
# дефолтные 23 байта делают перенос 400-КБ образа вечностью).
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# В этом дереве Zephyr счётчик RX-буферов рефакторен: общий лимит
# ведёт стек (flow control), извне настраиваются только «лишние»
# буферы (BT_BUF_ACL_RX_COUNT больше не существует).
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=4

# ================================================================== #
#  Внешняя FLASH W25Q32 (4 МБ, узел &w25q32 на spi1, CS=PB6) — ТЗ 4.1    #
#                                                                       #
#  CONFIG_FLASH / CONFIG_FLASH_MAP уже включены выше (NVS для BT).      #
#  CONFIG_SPI_NOR    — драйвер drivers/flash/spi_nor.c; включается      #
#                      сам по факту узла "jedec,spi-nor" в DT,          #
#                      здесь явно для наглядности.                      #
# ================================================================== #
CONFIG_SPI_NOR=y

# Erase-гранулярность драйвера: 4 КБ (сектора W25Q32) вместо дефолтных
# 64 КБ. От неё отдаёт сектора flash_area_get_sectors() → FCB журнала
# ротирует 32 сектора по 4 КБ (износ равномернее), а не 2 по 64 КБ.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# ================================================================== #
#  Кольцевой журнал событий (ТЗ 4.2) — FCB                              #
#                                                                       #
#  FCB (Flash Circular Buffer) — append-only кольцевой буфер по         #
#  секторам с CRC на каждую запись и автоматической ротацией            #
#  (амортизация износа). Запись ТЗ: 10 Б = ts(4)+type(1)+data(4)+CRC8.  #
#  Реализация: src/event_log.c.                                         #
# ================================================================== #
CONFIG_FCB=y

# ================================================================== #
#  Системный лог во внешней FLASH (ТЗ 4.1: ≤64 КБ)                       #
#                                                                       #
#  littlefs на партиции syslog (маунт /syslog через fstab в DT),        #
#  LOG_BACKEND_FS пишет LOG_* файлами log.NNNN: лимит 8 файлов ×        #
#  8 КБ = 64 КБ, старые удаляются (OVERWRITE). Логи по-прежнему         #
#  идут и в RTT (Channel 1) — флеш это дубль, не замена.                #
# ================================================================== #
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_LOG_BACKEND_FS=y
CONFIG_LOG_BACKEND_FS_DIR="/syslog"
CONFIG_LOG_BACKEND_FS_FILE_SIZE=8192
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=6

# ================================================================== #
#  Shell на RTT (Channel 0, поверх консоли)                             #
#                                                                       #
#  Команды: journal dump/clear (src/event_log.c), fs ls/read            #
#  (FILE_SYSTEM_SHELL — смотреть /syslog, /data).                      #
#  ВНИМАНИЕ: поллинг RTT не даёт CPU1 войти в STOP2 — это отладочный   #
#  режим (сейчас PM выключен, не критично); при возврате PM —           #
#  CONFIG_SHELL=n (см. предупреждение в секции RTT выше).              #
# ================================================================== #
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_FILE_SYSTEM_SHELL=y

# ================================================================== #
#  RTC — метки времени журнала (ТЗ 4.2: UNIX timestamp)                 #
#                                                                       #
#  Драйвер rtc_stm32 (узел &rtc уже okay в DTS платы, тактирование      #
#  LSI). Синхронизации времени пока нет: метки монотонны от старта      #
#  питания, календарно фиктивны до первой установки времени.           #
# ================================================================== #
CONFIG_RTC=y
CONFIG_RTC_STM32=y

# ================================================================== #
#  Шифрование пользовательских данных (ТЗ 4.3): PSA Crypto, AES-256-GCM #
#                                                                       #
#  Крипто-стек: PSA Crypto API поверх mbedTLS (модуль tf-psa-crypto);   #
#  включено только необходимое: AES + GCM (остальное не линкуется).     #
#  Ключ: RNG при первом старте → NVS (settings sec/aeskey; CONFIG_SETTINGS#
#  уже включён выше для BT), реализация src/user_data.c; выбор стека    #
#  обоснован в Badge_Obsidian/Работа/Криптозащита пользовательских      #
#  данных.md.                                                          #
# ================================================================== #
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_GCM=y
